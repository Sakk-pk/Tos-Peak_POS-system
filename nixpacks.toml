# Nixpacks deployment configuration for Laravel + Vite on Railway
providers = ["php", "node"]

[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_mysql", "composer", "nodejs_20"]

[phases.build]
cmds = [
    "mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions bootstrap/cache public/storage",
    "php artisan storage:link || true",
    "npm run build",
    "php artisan optimize:clear"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=PermissionSeeder --force && php artisan db:seed --class=UserSeeder --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
